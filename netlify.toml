# This file didn't exist before, which means every serverless function on
# this site has been running under Netlify's default synchronous function
# timeout — including the Free Creative Report's AI analysis call, which
# generates a large, detailed report and can genuinely take a while.
#
# NOTE: an earlier version of this file used a flat `timeout = 26` under
# [functions], which Netlify's own config parser rejected outright
# ("functions.timeout must be an object") — that flat syntax is not valid
# for this build image. The correct current syntax scopes timeout per a
# function-name glob pattern instead.
[functions."*"]
  timeout = 30
